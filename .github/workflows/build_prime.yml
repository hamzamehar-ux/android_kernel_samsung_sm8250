name: Build prime kernel


  build:
    runs-on: ubuntu-latest
    outputs:
      release_ts: ${{ steps.ts.outputs.release_ts }}
    needs: prepare

    strategy:
      matrix:
        device:
          - { y2q }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            unzip \
            wget \
            zip \
            zstd

      - name: Download latest Google clang
        run: |
          wget -O llvm.tar.zst https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          mkdir llvm-21; cd llvm-21
          tar -I unzstd -xf ../llvm.tar.zst
          rm ../llvm.tar.zst
          cd ..

      - name: Build kernel
        run: |
          chmod +x build_prime.sh
          bash build_prime.sh \
            "${{ matrix.device.name }}" \
            "${{ matrix.device.name2 }}" \
            "${{ matrix.device.name3 }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: PrimeKernel-${{ matrix.device.name }}-${{ needs.prepare.outputs.release_ts }}
          path: |
            AnyKernel3/
            images/
